<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripWise – Retro airline template</title>
<style>
  /* ---------- Palette (change these to re-theme) ---------- */
  :root {
    --paper:  #F6EAD0;
    --card:   #FFFBF2;
    --navy:   #1B3A5C;
    --orange: #E8702A;
    --teal:   #2A9D8F;
    --earth:  #A4622B;
    --stamp:  #C4472B;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  /* Light dotted pattern on the page background */
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--navy);
    background-color: var(--paper);
    background-image: radial-gradient(rgba(164, 98, 43, .22) 1px, transparent 1px);
    background-size: 12px 12px;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    padding: 24px clamp(16px, 5vw, 64px);
  }

  /* ---------- Background artwork (all decorative) ---------- */
  .art { position: absolute; pointer-events: none; z-index: 0; }

  /* Compass: top-right, bleeding off the right edge, tilted 15deg.
     Move it with --cx / --cy (centre point as % of the hero); resize with --cw. */
  .compass {
    --cw: clamp(250px, 26vw, 420px);
    --cx: 84%;
    --cy: 26%;
    width: var(--cw);
    left: calc(var(--cx) - var(--cw) / 2);
    top: calc(var(--cy) - var(--cw) / 2);
    transform: rotate(15deg);
    animation: compass-rotate 30s linear infinite;
  }

  @keyframes compass-rotate {
    from { transform: rotate(15deg); }
    to   { transform: rotate(375deg); }
  }

  /* Globe with dashed orbit: bottom-left */
  .globe { left: 3%; bottom: 5%; width: clamp(150px, 15vw, 220px); }
  .globe .meridian {
    animation: globe-meridian 15s linear infinite;
  }
  .globe .m1 { animation-delay: -5s; }
  .globe .m2 { animation-delay: -10s; }

  @keyframes globe-meridian {
    0%   { transform: scaleX(-1);     opacity: 0; }
    8%   { transform: scaleX(-0.969); opacity: 1; }
    10%  { transform: scaleX(-0.951); }
    20%  { transform: scaleX(-0.809); }
    30%  { transform: scaleX(-0.588); }
    40%  { transform: scaleX(-0.309); }
    50%  { transform: scaleX(0); }
    60%  { transform: scaleX(0.309); }
    70%  { transform: scaleX(0.588); }
    80%  { transform: scaleX(0.809); }
    90%  { transform: scaleX(0.951); }
    92%  { transform: scaleX(0.969);  opacity: 1; }
    100% { transform: scaleX(1);      opacity: 0; }
  }

  /* Passport stamp: pinned to the south-east corner */
  .stamp { right: 2.5%; bottom: 2%; width: clamp(64px, 7vw, 96px); }

  /* Coordinates line between globe and stamp */
  .coords {
    position: absolute; z-index: 0; left: 40%; bottom: 3%;
    font: 11px/1 "Courier New", monospace; color: var(--navy); opacity: .4;
    pointer-events: none;
  }

  /* Dashed flight route with a small plane */
  .route { left: 0; right: 0; top: 40%; height: clamp(60px, 10vw, 120px); }
  .route svg { width: 100%; height: 100%; display: block; }
  .route .plane { position: absolute; left: 50%; top: 17%; width: 22px; transform: translate(-50%, -50%) rotate(-4deg); }

  /* Small diamond stars */
  .dia { position: absolute; z-index: 0; width: 8px; height: 8px; background: rgba(27, 58, 92, .25); transform: rotate(45deg); pointer-events: none; }

  /* ---------- Content ---------- */
  .content { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .logo { font-size: 20px; font-weight: bold; }
  .nav ul { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; font: bold 13px "Courier New", monospace; }
  .nav a {
    position: relative;
    display: inline-block;
    color: var(--navy);
    background: var(--card);
    text-decoration: none;
    padding: 7px 14px 7px 36px;
    border: 1.5px solid var(--navy);
    border-radius: 5px;
    box-shadow: 2px 2px 0 var(--navy);
    letter-spacing: .04em;
    overflow: hidden;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .nav a::before {
    content: "✦";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--orange);
    color: var(--card);
    font-size: 11px;
    border-right: 1.5px dashed var(--navy);
  }
  .nav li:nth-child(2) a::before {
    content: "✈";
    background: var(--teal);
  }
  .nav a:hover, .nav a:focus-visible {
    background: var(--paper);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--navy);
    outline: none;
  }
  .nav a:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 var(--navy);
  }

  /* Three-stripe motif */
  .stripes { display: flex; gap: 3px; max-width: 300px; margin-bottom: clamp(28px, 6vw, 70px); }
  .stripes span { height: 5px; }
  .stripes span:nth-child(1) { flex: 3; background: var(--orange); }
  .stripes span:nth-child(2) { flex: 2; background: var(--teal); }
  .stripes span:nth-child(3) { flex: 1; background: var(--navy); }

  h1 { margin: 0 0 18px; font-size: clamp(34px, 5.5vw, 64px); font-weight: normal; line-height: 1.1; }

  .search { display: flex; max-width: 460px; background: var(--card); border: 1px solid var(--navy); border-radius: 6px; overflow: hidden; }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 13px 14px; font: 16px Georgia, serif; color: var(--navy); }
  .search input:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
  .search button { border: 0; background: var(--orange); color: var(--navy); padding: 0 22px; font: bold 15px Georgia, serif; cursor: pointer; }
  .search button:hover { filter: brightness(.95); }
  .search button:focus-visible { outline: 2px solid var(--navy); outline-offset: -4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { font: 13px "Courier New", monospace; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--navy); background: transparent; color: var(--navy); cursor: pointer; }
  .chip.on { background: var(--navy); color: var(--paper); }

  @media (max-width: 600px) {
    .compass { --cw: 240px; --cx: 88%; --cy: 22%; }
    .coords { display: none; }
    .nav ul { gap: 8px; font-size: 12px; }
    .nav a { padding: 6px 10px 6px 32px; }
    .nav a::before { width: 22px; }
  }
</style>
</head>
<body>
<main class="hero">

  <!-- Compass rose -->
  <svg class="art compass" viewBox="-76 -76 152 152" aria-hidden="true">
    <defs>
      <g id="cp"><path d="M0-58L7-7L0 0Z" fill="#A4622B" fill-opacity=".3"/><path d="M0-58L-7-7L0 0Z"/></g>
      <path id="ic" d="M0-40L4-4L0 0L-4-4Z"/>
    </defs>
    <g fill="none" stroke="#A4622B" stroke-opacity=".4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <circle r="72" stroke-dasharray="2 5"/><circle r="60"/><circle r="54" stroke-dasharray="1 5.9"/><circle r="40"/>
      <use href="#ic" transform="rotate(45)"/><use href="#ic" transform="rotate(135)"/><use href="#ic" transform="rotate(225)"/><use href="#ic" transform="rotate(315)"/>
      <use href="#cp"/><use href="#cp" transform="rotate(90)"/><use href="#cp" transform="rotate(180)"/><use href="#cp" transform="rotate(270)"/>
      <circle r="3.5" fill="#F6EAD0"/><circle r="1.4" fill="#A4622B" stroke="none"/>
      <g stroke="none" fill="#A4622B" fill-opacity=".6" font-family="Georgia,serif" text-anchor="middle">
        <text y="-64" font-size="10">N</text><text y="72" font-size="9">S</text>
        <text x="66" y="3" font-size="9">E</text><text x="-66" y="3" font-size="9">W</text>
      </g>
    </g>
  </svg>

  <!-- Globe with dashed orbit -->
  <svg class="art globe" viewBox="-64 -42 128 84" aria-hidden="true">
    <g fill="none" stroke="#1B3A5C" stroke-opacity=".28" stroke-width="1.2">
      <circle r="38"/>
      <path class="meridian m1" d="M0-38A38 38 0 0 1 0 38" vector-effect="non-scaling-stroke"/>
      <path class="meridian m2" d="M0-38A38 38 0 0 1 0 38" vector-effect="non-scaling-stroke"/>
      <path class="meridian m3" d="M0-38A38 38 0 0 1 0 38" vector-effect="non-scaling-stroke"/>
      <path d="M-38 0H38M-35 -15H35M-35 15H35"/>
    </g>
    <ellipse rx="60" ry="17" transform="rotate(-20)" fill="none" stroke="#E8702A" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="4 4"/>
  </svg>

  <!-- Dashed flight route + plane -->
  <div class="art route" aria-hidden="true">
    <svg viewBox="0 100 300 60" preserveAspectRatio="none"><path d="M0 150Q120 70 300 150" fill="none" stroke="#2A9D8F" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/></svg>
    <svg class="plane" viewBox="0 0 14 14"><path d="M13 3L1 5.5L5.5 8L3 12Z" fill="none" stroke="#2A9D8F" stroke-opacity=".7" stroke-width="1" stroke-linejoin="round"/></svg>
  </div>

  <!-- Diamond stars -->
  <i class="dia" style="left:43%;top:12%"></i>
  <i class="dia" style="left:60%;top:8%"></i>
  <i class="dia" style="left:37%;top:30%"></i>
  <i class="dia" style="left:7%;top:46%"></i>

  <!-- Passport stamp -->
  <svg class="art stamp" viewBox="-32 -32 64 64" aria-hidden="true">
    <g transform="rotate(-12)" fill="none" stroke="#C4472B" stroke-opacity=".5" stroke-width="1.4" stroke-linejoin="round">
      <circle r="28"/><circle r="23" stroke-dasharray="2 3"/>
      <path d="M0-9L2.6-2.8L9-2.8L4 1.4L5.8 8L0 4.2L-5.8 8L-4 1.4L-9-2.8L-2.6-2.8Z"/><path d="M-17 11H17"/>
      <text y="-13" text-anchor="middle" font-size="5.5" font-family="monospace" fill="#C4472B" fill-opacity=".55" stroke="none">TRIPWISE</text>
      <text y="18" text-anchor="middle" font-size="6" font-family="monospace" fill="#C4472B" fill-opacity=".55" stroke="none">VISITED</text>
    </g>
  </svg>

  <div class="coords" aria-hidden="true">LAT 35.01 N · LON 135.76 E</div>

  <!-- Page content -->
  <div class="content">
    <nav class="nav" aria-label="Main">
      <span class="logo">TripWise</span>
      <ul><li><a href="#">Explore</a></li><li><a href="#">My Trip</a></li></ul>
    </nav>
    <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>

    <h1>Where to next?</h1>
    <form class="search" role="search" onsubmit="return false">
      <input type="search" placeholder="Search Kyoto, Lisbon…" aria-label="Search destinations">
      <button type="submit">Go</button>
    </form>
    <div class="chips">
      <button class="chip on" type="button">Beaches</button>
      <button class="chip" type="button">Temples</button>
      <button class="chip" type="button">Markets</button>
    </div>
  </div>

</main>
</body>
</html>
